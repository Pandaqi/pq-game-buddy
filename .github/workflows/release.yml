name: release

# The whole pipeline in one file, so a push cannot be gated by one workflow and silently
# skipped by another. Every push to `main` that changes something other than prose runs
# the gate; the second job then asks one question about package.json: does a GitHub
# Release `v<version>` exist already? No - build the three shapes, tag the commit,
# publish. Yes - stop. Runs are billed in Actions minutes, so nothing runs for words.
# Contract: docs/RELEASING.md, section 2.

on:
  push:
    branches: [main]
    # Prose ships nothing and every run spends minutes: a commit whose files are all
    # markdown or under docs/ starts no run at all. package.json is deliberately absent
    # from this list, so a version bump always runs even when the rest is words.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# Tagging the commit and opening the Release both write to the repository.
permissions:
  contents: write

# One release at a time: a second push on `main` waits rather than racing the first tag.
# Nothing is cancelled, because a half-run release is worse than a late one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Stale manifest, tsc, svelte-check, tests, template lint, build and its budgets.
      - run: bun run check
      # That build is the hosted build, so hand it to the release job instead of
      # compiling the same thing twice.
      - uses: actions/upload-artifact@v4
        with:
          name: hosted
          path: dist
          retention-days: 1

  release:
    name: release
    needs: gate
    # A release is cut from `main` only; a manual run from another branch just gates.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Every tag, so "has this version already shipped" is decided from history.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Read the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(bun -p "require('./package.json').version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?(\+[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::package.json version \"$version\" is not semantic versioning (MAJOR.MINOR.PATCH)."
            exit 1
          fi
          tag="v$version"
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          echo "package.json says $version${previous:+; the last release was $previous}."
          # A Release, not a tag, is what "already shipped" means: a run that pushed the
          # tag but died before the Release finished retries instead of skipping forever.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag is already released; nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$tag is new; building the three shapes."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install
        if: steps.version.outputs.release == 'true'
        run: bun install --frozen-lockfile

      - name: Hosted build from the gate
        if: steps.version.outputs.release == 'true'
        uses: actions/download-artifact@v4
        with:
          name: hosted
          path: release/hosted

      - name: Build the other two shapes and pack them
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Both builds wipe dist/, so the hosted copy stays where the gate put it.
          bun run build:site
          cp -r dist release/site
          bun run build:single
          cp dist/index.html "release/pq-game-buddy-$VERSION.html"
          cd release
          zip -q -r "pq-game-buddy-$VERSION-hosted.zip" hosted
          zip -q -r "pq-game-buddy-$VERSION-site.zip" site
          # An empty asset is worse than a failed release: stop before tagging anything.
          test -s "pq-game-buddy-$VERSION.html"
          test -s "pq-game-buddy-$VERSION-hosted.zip"
          test -s "pq-game-buddy-$VERSION-site.zip"
          ls -lh .

      - name: Tag and publish the release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          cat > release/notes.md <<EOF
          Game Buddy $VERSION - three builds from one source. Pick the one that fits.

          | Download | What you get |
          | --- | --- |
          | **pq-game-buddy-$VERSION.html** | The whole app in one file. Double-click it: works from disk, offline, nothing to install. |
          | **pq-game-buddy-$VERSION-hosted.zip** | The hosted build: the page, its scripts, styles, lazy chunks and fonts. Serve the folder from any static host. |
          | **pq-game-buddy-$VERSION-site.zip** | The hosted build plus a real page per tool and per template, a sitemap and the template catalogue, for links and search engines. |

          Each zip unpacks into a folder of its own. The app makes no network request at
          runtime; the single file is the surest way to play without internet.

          What changed is in [CHANGELOG.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md).
          EOF
          # The tag goes on only after every artifact exists, so a failed build can never
          # make the next run believe this version already shipped.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists; reusing it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Game Buddy $TAG"
            git push origin "$TAG"
          fi
          gh release create "$TAG" \
            --title "Game Buddy $VERSION" \
            --notes-file release/notes.md \
            --verify-tag \
            "release/pq-game-buddy-$VERSION.html#One file: open it and play" \
            "release/pq-game-buddy-$VERSION-hosted.zip#Hosted build" \
            "release/pq-game-buddy-$VERSION-site.zip#Site build: a page per tool and template"
